{% extends 'base.html' %}
{% load static %}

{% block title %}ShopFlow — интернет-магазин{% endblock %}

{% block content %}
<section class="text-center pt-6 sm:pt-10 pb-2 sm:pb-3">
    <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-white [text-shadow:0_2px_10px_rgba(0,0,0,0.8)]">
        Добро пожаловать в интернет-магазин
    </h1>
    <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="{% url 'catalog' %}" class="inline-flex justify-center items-center px-6 py-3 rounded-lg bg-white text-indigo-600 font-bold shadow-sm hover:bg-gray-200 transition-colors">
            Перейти в каталог товаров
        </a>
        <a href="{% url 'login' %}" class="js-guest inline-flex justify-center items-center px-6 py-3 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition-colors">
            Войти
        </a>
    </div>
</section>

<section class="mt-0">
    <div class="mb-4">
        <h2 class="text-2xl font-bold text-white [text-shadow:0_2px_10px_rgba(0,0,0,0.8)]">Новинки</h2>
    </div>
    <div id="carousel" class="flex gap-4 overflow-x-auto scroll-smooth snap-x snap-mandatory pb-3"></div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
