{% extends 'base.html' %}
{% load static assets %}

{% block title %}Каталог — ShopFlow{% endblock %}

{% block content %}
<h1 class="text-[28px] font-bold mb-6 text-white [text-shadow:0_2px_10px_rgba(0,0,0,0.8)]">Каталог</h1>

<form id="filters" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-6">
    <input id="search" type="search" placeholder="Поиск по названию"
           class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
    <select id="category"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Все категории</option>
    </select>
    <select id="ordering"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Сортировка: по умолчанию</option>
        <option value="name">Название (А–Я)</option>
        <option value="-name">Название (Я–А)</option>
        <option value="price">Цена (сначала дешевле)</option>
        <option value="-price">Цена (сначала дороже)</option>
        <option value="-created_at">Сначала новые</option>
        <option value="created_at">Сначала старые</option>
    </select>
</form>

<div id="status" class="text-gray-500 mb-4"></div>

<div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

<div id="pagination" class="hidden flex items-center justify-center gap-4 mt-8">
    <button id="prevPage" type="button"
            class="px-4 py-2 rounded-lg border border-gray-300 bg-white text-sm hover:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed">
        Назад
    </button>
    <span id="pageInfo" class="text-sm font-semibold text-white [text-shadow:0_2px_10px_rgba(0,0,0,0.8)]"></span>
    <button id="nextPage" type="button"
            class="px-4 py-2 rounded-lg border border-gray-300 bg-white text-sm hover:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed">
        Вперёд
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static_v 'js/catalog.js' %}"></script>
{% endblock %}
