{% load static assets %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}ShopFlow{% endblock %}</title>

    <script src="{% static_v 'js/tailwind.js' %}"></script>

    <link href="{% static_v 'css/style.css' %}" rel="stylesheet">

    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col text-gray-900" style="background: url('{% static_v 'img/background.png' %}') center / cover no-repeat fixed;">

    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <nav class="max-w-6xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <a href="{% url 'home' %}" class="text-xl font-bold tracking-wide">
                    Shop<span class="text-indigo-600">Flow</span>
                </a>

                <div class="hidden md:flex items-center gap-6">
                    <a href="{% url 'catalog' %}" class="text-gray-600 hover:text-indigo-600 transition-colors">Каталог</a>
                    <a href="{% url 'cart' %}" class="text-gray-600 hover:text-indigo-600 transition-colors">Корзина</a>
                    <a href="{% url 'orders' %}" class="text-gray-600 hover:text-indigo-600 transition-colors">Заказы</a>
                    <a href="{% url 'manage' %}" class="js-admin hidden text-gray-600 hover:text-indigo-600 transition-colors">Управление</a>

                    <a href="{% url 'login' %}" class="js-guest text-gray-600 hover:text-indigo-600 transition-colors">Войти</a>
                    <div class="js-user hidden flex items-center gap-6">
                        <span class="js-username px-3 py-1 rounded-md bg-indigo-50 text-indigo-700 font-medium">Профиль</span>
                        <button type="button" class="js-logout text-gray-600 hover:text-indigo-600 transition-colors">Выйти</button>
                    </div>
                </div>

                <button type="button" id="burgerBtn"
                        class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-600 hover:bg-gray-100"
                        aria-label="Меню" aria-expanded="false" aria-controls="mobileMenu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>

            <div id="mobileMenu" class="hidden md:hidden pb-4">
                <div class="flex flex-col gap-1">
                    <a href="{% url 'catalog' %}" class="px-2 py-2 rounded-md text-gray-600 hover:bg-gray-100">Каталог</a>
                    <a href="{% url 'cart' %}" class="px-2 py-2 rounded-md text-gray-600 hover:bg-gray-100">Корзина</a>
                    <a href="{% url 'orders' %}" class="px-2 py-2 rounded-md text-gray-600 hover:bg-gray-100">Заказы</a>
                    <a href="{% url 'manage' %}" class="js-admin hidden px-2 py-2 rounded-md text-gray-600 hover:bg-gray-100">Управление</a>

                    <a href="{% url 'login' %}" class="js-guest px-2 py-2 rounded-md text-gray-600 hover:bg-gray-100">Войти</a>
                    <div class="js-user hidden flex flex-col gap-1">
                        <span class="js-username self-start mx-2 my-1 px-3 py-1 rounded-md bg-indigo-50 text-indigo-700 font-medium">Профиль</span>
                        <button type="button" class="js-logout text-left px-2 py-2 rounded-md text-gray-600 hover:bg-gray-100">Выйти</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        (function () {
            var btn = document.getElementById('burgerBtn');
            var menu = document.getElementById('mobileMenu');
            if (!btn || !menu) return;
            btn.addEventListener('click', function () {
                var open = menu.classList.toggle('hidden') === false;
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
        })();
    </script>

    <script src="{% static_v 'js/api.js' %}"></script>
    <script src="{% static_v 'js/session.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
