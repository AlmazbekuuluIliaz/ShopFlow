{% extends 'base.html' %}
{% load static assets %}

{% block title %}Вход — ShopFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8">
        <div class="grid grid-cols-2 gap-1 mb-6 p-1 bg-gray-100 rounded-lg">
            <button type="button" id="tabLogin"
                    class="py-2 rounded-md text-sm font-medium transition-colors bg-white shadow-sm">
                Вход
            </button>
            <button type="button" id="tabRegister"
                    class="py-2 rounded-md text-sm font-medium transition-colors text-gray-600">
                Регистрация
            </button>
        </div>

        <div id="formError" class="hidden mb-4 rounded-lg bg-red-50 text-red-700 text-sm px-4 py-3"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
                <input name="username" type="text" autocomplete="username" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input name="password" type="password" autocomplete="current-password" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit"
                    class="w-full rounded-lg bg-indigo-600 text-white font-medium py-2.5 hover:bg-indigo-700 transition-colors">
                Войти
            </button>
        </form>

        <form id="registerForm" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
                <input name="username" type="text" autocomplete="username" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Email <span class="text-gray-400 font-normal">(необязательно)</span>
                </label>
                <input name="email" type="email" autocomplete="email"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Телефон <span class="text-gray-400 font-normal">(необязательно)</span>
                </label>
                <input name="phone" type="tel" autocomplete="tel"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input name="password" type="password" autocomplete="new-password" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit"
                    class="w-full rounded-lg bg-indigo-600 text-white font-medium py-2.5 hover:bg-indigo-700 transition-colors">
                Зарегистрироваться
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static_v 'js/auth.js' %}"></script>
{% endblock %}
