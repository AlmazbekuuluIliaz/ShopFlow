{% extends 'base.html' %}
{% load static assets %}

{% block title %}Корзина — ShopFlow{% endblock %}

{% block content %}
<h1 class="text-[28px] font-bold mb-6 text-white [text-shadow:0_2px_10px_rgba(0,0,0,0.8)]">Корзина</h1>

<div id="status" class="text-gray-500"></div>

<div id="empty" class="hidden text-center py-16">
    <p class="text-white mb-4 [text-shadow:0_2px_10px_rgba(0,0,0,0.8)]">Ваша корзина пуста</p>
    <a href="{% url 'catalog' %}" class="inline-flex px-6 py-3 rounded-lg bg-white text-indigo-600 font-bold shadow-sm hover:bg-gray-200 transition-colors">
        Перейти в каталог
    </a>
</div>

<div id="cart" class="hidden grid grid-cols-1 lg:grid-cols-4 gap-6">
    <div id="items" class="lg:col-span-3 space-y-3"></div>

    <aside class="bg-white border border-gray-200 rounded-xl p-5 h-fit">
        <h2 class="font-semibold mb-4">Итого</h2>
        <div class="flex justify-between text-sm text-gray-600 mb-2">
            <span>Товаров</span>
            <span id="sumQty">0</span>
        </div>
        <div class="flex justify-between text-lg font-semibold border-t border-gray-200 pt-3 mt-3">
            <span>Сумма</span>
            <span id="sumTotal">—</span>
        </div>
        <button id="checkout" type="button"
                class="w-full mt-5 rounded-lg bg-indigo-600 text-white font-medium py-2.5 hover:bg-indigo-700 transition-colors">
            Перейти к оформлению
        </button>
    </aside>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static_v 'js/cart.js' %}"></script>
{% endblock %}
