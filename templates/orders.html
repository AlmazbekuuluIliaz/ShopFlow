{% extends 'base.html' %}
{% load static %}

{% block title %}Мои заказы — ShopFlow{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Мои заказы</h1>

<div id="status" class="text-gray-500"></div>

<div id="empty" class="hidden text-center py-16">
    <p class="text-gray-500 mb-4">У вас пока нет заказов.</p>
    <a href="{% url 'catalog' %}" class="inline-flex px-6 py-3 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition-colors">
        Перейти в каталог
    </a>
</div>

<div id="orders" class="space-y-4"></div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/orders.js' %}"></script>
{% endblock %}
